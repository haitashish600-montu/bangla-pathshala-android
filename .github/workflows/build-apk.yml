name: Build Bangla Pathshala APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/in/banglapathshala/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BanglaPathshala"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.19.0')
              implementation 'com.google.firebase:firebase-messaging'
          }

          android {
              namespace 'in.banglapathshala.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'in.banglapathshala.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file('../release-keystore.jks')
                      storePassword System.getenv('BP_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('BP_KEY_ALIAS')
                      keyPassword System.getenv('BP_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">বাংলা পাঠশালা</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MyFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/in/banglapathshala/app/MainActivity.java <<'EOF'
          package in.banglapathshala.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 2001;

              private static final String START_URL =
                      "https://haitashish600-montu.github.io/bangla-pathshala/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = filePathCallback;

                          try {
                              Intent intent = fileChooserParams.createIntent();
                              intent.setType("application/pdf");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false);
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                              return true;
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {

                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, String url) {

                          return handleUrl(url);
                      }
                  });

                  webView.loadUrl(START_URL);

                  FirebaseMessaging.getInstance()
                          .subscribeToTopic("all_students");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.POST_NOTIFICATIONS},
                              1001
                      );
                  }
              }

              private boolean handleUrl(String url) {

                  if (url.startsWith(
                          "https://haitashish600-montu.github.io/bangla-pathshala/")
                          || url.startsWith("https://docs.google.com/")
                          || url.startsWith("https://drive.google.com/")) {

                      return false;
                  }

                  if (url.startsWith("http://")
                          || url.startsWith("https://")
                          || url.startsWith("whatsapp:")
                          || url.startsWith("mailto:")
                          || url.startsWith("tel:")
                          || url.startsWith("tg:")
                          || url.startsWith("intent:")) {

                      try {
                          Intent intent = new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(url)
                          );

                          startActivity(intent);

                      } catch (Exception ignored) {
                      }

                      return true;
                  }

                  return false;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback != null) {
                          Uri[] results = null;

                          if (resultCode == RESULT_OK && data != null) {
                              Uri uri = data.getData();
                              if (uri != null) {
                                  results = new Uri[]{uri};
                              }
                          }

                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create Firebase Messaging Service
        shell: bash
        run: |
          cat > app/src/main/java/in/banglapathshala/app/MyFirebaseMessagingService.java <<'EOF'
          package in.banglapathshala.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class MyFirebaseMessagingService extends FirebaseMessagingService {

              private static final String CHANNEL_ID = "bangla_pathshala_notifications";

              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {

                  String title = remoteMessage.getNotification() != null
                          ? remoteMessage.getNotification().getTitle()
                          : remoteMessage.getData().get("title");

                  String body = remoteMessage.getNotification() != null
                          ? remoteMessage.getNotification().getBody()
                          : remoteMessage.getData().get("body");

                  if (title == null || title.isEmpty()) {
                      title = "বাংলা পাঠশালা";
                  }

                  if (body == null || body.isEmpty()) {
                      body = "নতুন বিজ্ঞপ্তি এসেছে।";
                  }

                  createNotificationChannel();

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT
                                  | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(this, CHANNEL_ID)
                                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                                  .setContentTitle(title)
                                  .setContentText(body)
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                                  .setPriority(NotificationCompat.PRIORITY_HIGH)
                                  .setAutoCancel(true)
                                  .setContentIntent(pendingIntent);

                  NotificationManagerCompat.from(this)
                          .notify((int) System.currentTimeMillis(), builder.build());
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "বাংলা পাঠশালা Notifications",
                              NotificationManager.IMPORTANCE_HIGH
                      );

                      NotificationManager manager =
                              getSystemService(NotificationManager.class);

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

      - name: Restore release keystore
        shell: bash
        env:
          BP_KEYSTORE_BASE64: ${{ secrets.BP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BP_KEYSTORE_BASE64" ]; then
            echo "ERROR: BP_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$BP_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

      - name: Build signed Release APK
        shell: bash
        env:
          BP_KEYSTORE_PASSWORD: ${{ secrets.BP_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.BP_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.BP_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: bangla-pathshala-release-apk
          path: app/build/outputs/apk/release/app-release.apk
