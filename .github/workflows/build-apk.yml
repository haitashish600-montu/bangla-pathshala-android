name: Build Bangla Pathshala APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/in/banglapathshala/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          cp "$GITHUB_WORKSPACE/launcher-icon.png" app/src/main/res/drawable/ic_launcher.png
    
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BanglaPathshala"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.19.0')
              implementation 'com.google.firebase:firebase-messaging'
                  implementation 'com.google.android.gms:play-services-ads:25.5.0'
          }

          android {
              namespace 'in.banglapathshala.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'in.banglapathshala.app'
                  minSdk 24
                  targetSdk 36
                  versionCode 3
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file('../release-keystore.jks')
                      storePassword System.getenv('BP_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('BP_KEY_ALIAS')
                      keyPassword System.getenv('BP_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">বাংলা পাঠশালা</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">
                  <meta-data
                          android:name="com.google.android.gms.ads.APPLICATION_ID"
                          android:value="ca-app-pub-1468455179153385~8676036054" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MyFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/in/banglapathshala/app/MainActivity.java <<'EOF'
          package in.banglapathshala.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.FrameLayout;
          import android.util.DisplayMetrics;
          import android.content.Context;
          import android.view.Gravity;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import com.google.firebase.messaging.FirebaseMessaging;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.AdError;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 2001;
              private static final String START_URL = "https://haitashish600-montu.github.io/bangla-pathshala/";
              private static final String BANNER_ID = "ca-app-pub-1468455179153385/2611078747";
              private static final String INTERSTITIAL_ID = "ca-app-pub-1468455179153385/8735660085";
              private InterstitialAd interstitialAd;
              private int viewChanges = 0;
              private boolean adShowing = false;
              private AdView adView;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  webView = new WebView(this);
                  root.addView(webView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);

                  MobileAds.initialize(this, status -> {});
                  adView = new AdView(this);
                  adView.setAdUnitId(BANNER_ID);
                  adView.setAdSize(getAdaptiveBannerSize(this));
                  root.addView(adView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  adView.loadAd(new AdRequest.Builder().build());
                  loadInterstitial();

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void onAppViewChanged() {
                          runOnUiThread(() -> {
                              viewChanges++;
                              if (viewChanges >= 4) {
                                  viewChanges = 0;
                                  showInterstitial();
                              }
                          });
                      }
                  }, "BPAds");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try {
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("application/pdf");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false);
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                              return true;
                          } catch (Exception e) { filePathCallback = null; return false; }
                      }
                  });
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript("(function(){if(window.__bpAdHooked)return;window.__bpAdHooked=true;var old=window.openView;if(typeof old==='function'){window.openView=function(){var r=old.apply(this,arguments);try{if(window.BPAds)window.BPAds.onAppViewChanged();}catch(e){}return r;};}})();", null);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) { return handleUrl(request.getUrl().toString()); }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) { return handleUrl(url); }
                  });
                  webView.loadUrl(START_URL);
                  FirebaseMessaging.getInstance().subscribeToTopic("all_students");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1001);
              }

              private AdSize getAdaptiveBannerSize(Context context) {
                  DisplayMetrics dm = context.getResources().getDisplayMetrics();
                  int width = (int)(dm.widthPixels / dm.density);
                  return AdSize.getCurrentOrientationAnchoredAdaptiveBannerAdSize(context, width);
              }
              private void loadInterstitial() {
                  InterstitialAd.load(this, INTERSTITIAL_ID, new AdRequest.Builder().build(), new InterstitialAdLoadCallback() {
                      @Override public void onAdLoaded(InterstitialAd ad) { interstitialAd = ad; }
                      @Override public void onAdFailedToLoad(LoadAdError error) { interstitialAd = null; }
                  });
              }
              private void showInterstitial() {
                  if (interstitialAd == null || adShowing) { if (interstitialAd == null) loadInterstitial(); return; }
                  adShowing = true;
                  interstitialAd.setFullScreenContentCallback(new FullScreenContentCallback() {
                      @Override public void onAdDismissedFullScreenContent() { adShowing = false; interstitialAd = null; loadInterstitial(); }
                      @Override public void onAdFailedToShowFullScreenContent(AdError error) { adShowing = false; interstitialAd = null; loadInterstitial(); }
                  });
                  interstitialAd.show(this);
              }
              private boolean handleUrl(String url) {
                  if (url.startsWith("https://haitashish600-montu.github.io/bangla-pathshala/") || url.startsWith("https://docs.google.com/") || url.startsWith("https://drive.google.com/")) return false;
                  if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("whatsapp:") || url.startsWith("mailto:") || url.startsWith("tel:") || url.startsWith("tg:") || url.startsWith("intent:")) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                      return true;
                  }
                  return false;
              }
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE && filePathCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) results = new Uri[]{data.getData()};
                      filePathCallback.onReceiveValue(results); filePathCallback = null;
                  }
              }
              @Override protected void onResume() { super.onResume(); if (adView != null) adView.resume(); }
              @Override protected void onPause() { if (adView != null) adView.pause(); super.onPause(); }
              @Override protected void onDestroy() { if (adView != null) adView.destroy(); if (webView != null) webView.destroy(); super.onDestroy(); }
              @Override public void onBackPressed() { if (webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
          }
          EOF

      - name: Create Firebase Messaging Service
        shell: bash
        run: |
          cat > app/src/main/java/in/banglapathshala/app/MyFirebaseMessagingService.java <<'EOF'
          package in.banglapathshala.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class MyFirebaseMessagingService extends FirebaseMessagingService {

              private static final String CHANNEL_ID = "bangla_pathshala_notifications";

              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {

                  String title = remoteMessage.getNotification() != null
                          ? remoteMessage.getNotification().getTitle()
                          : remoteMessage.getData().get("title");

                  String body = remoteMessage.getNotification() != null
                          ? remoteMessage.getNotification().getBody()
                          : remoteMessage.getData().get("body");

                  if (title == null || title.isEmpty()) {
                      title = "বাংলা পাঠশালা";
                  }

                  if (body == null || body.isEmpty()) {
                      body = "নতুন বিজ্ঞপ্তি এসেছে।";
                  }

                  createNotificationChannel();

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT
                                  | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(this, CHANNEL_ID)
                                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                                  .setContentTitle(title)
                                  .setContentText(body)
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                                  .setPriority(NotificationCompat.PRIORITY_HIGH)
                                  .setAutoCancel(true)
                                  .setContentIntent(pendingIntent);

                  NotificationManagerCompat.from(this)
                          .notify((int) System.currentTimeMillis(), builder.build());
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "বাংলা পাঠশালা Notifications",
                              NotificationManager.IMPORTANCE_HIGH
                      );

                      NotificationManager manager =
                              getSystemService(NotificationManager.class);

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

      - name: Restore release keystore
        shell: bash
        env:
          BP_KEYSTORE_BASE64: ${{ secrets.BP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BP_KEYSTORE_BASE64" ]; then
            echo "ERROR: BP_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$BP_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks
      - name: Add Play registration proof
        env:
          ADI_SNIPPET: ${{ secrets.BP_ADI_SNIPPET }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$ADI_SNIPPET" > app/src/main/assets/adi-registration.properties

      - name: Build signed Release APK
        shell: bash
        env:
          BP_KEYSTORE_PASSWORD: ${{ secrets.BP_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.BP_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.BP_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: bangla-pathshala-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: bangla-pathshala-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
